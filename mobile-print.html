<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>Preview Nota SHIROGANE</title>
<link rel="stylesheet" href="styles.css?v=2.0.0">
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:Inter,Segoe UI,Arial,sans-serif;color:#111827}.mobile-print-bar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;padding:10px;background:#111827}.mobile-print-bar button{flex:1;border:0;border-radius:10px;padding:12px 10px;font-weight:800;background:#fff;color:#111827}.mobile-print-bar .primary{background:#d4a84b}.mobile-sheet{width:min(100%,900px);margin:12px auto;background:#fff;padding:14px;min-height:60vh}.mobile-sheet.thermal{width:80mm;max-width:100%;padding:4mm}.message{padding:50px 20px;text-align:center;color:#64748b}@media print{.mobile-print-bar{display:none!important}body{background:#fff}.mobile-sheet{margin:0!important;padding:0!important;box-shadow:none!important}.mobile-sheet.thermal{width:80mm!important;padding:2mm!important}@page{margin:8mm}.mobile-sheet.thermal~*{display:none}}
</style>
</head>
<body>
<div class="mobile-print-bar no-print"><button type="button" id="backBtn">← Kembali</button><button type="button" class="primary" id="printBtn">🖨 Cetak / Simpan PDF</button></div>
<main id="sheet" class="mobile-sheet"><div class="message">Memuat nota…</div></main>
<script>
(function(){
 const raw=localStorage.getItem('shirogane-mobile-print');
 const sheet=document.getElementById('sheet');
 try{
  const payload=JSON.parse(raw||'null');
  if(!payload||!payload.html)throw new Error('Data nota tidak ditemukan');
  document.title=(payload.invoice||'Nota SHIROGANE')+' - Preview';
  sheet.classList.toggle('thermal',payload.type==='thermal');
  sheet.innerHTML=payload.html;
 }catch(err){sheet.innerHTML='<div class="message"><b>Nota tidak dapat dibuka.</b><br>Silakan kembali dan tekan Print lagi.</div>';console.error(err)}
 document.getElementById('backBtn').addEventListener('click',()=>{history.length>1?history.back():location.replace('./index.html?v=200')});
 document.getElementById('printBtn').addEventListener('click',()=>{setTimeout(()=>window.print(),50)});
})();
</script>
</body>
</html>
