<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preview Nota SHIROGANE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:#111827;font-family:Arial,sans-serif}.bar{position:sticky;top:0;z-index:10;display:flex;gap:8px;padding:10px;background:#111827}.bar button{flex:1;min-height:46px;border:0;border-radius:10px;font-weight:800;font-size:14px}.print{background:#fff;color:#111827}.back{background:#334155;color:#fff}.sheet{width:min(100% - 20px,794px);margin:12px auto;background:#fff;padding:18px;box-shadow:0 8px 30px rgba(15,23,42,.15)}.sheet.thermal{width:min(100% - 20px,320px);padding:10px}.head{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111827;padding-bottom:12px}.logo{width:60px;height:60px;object-fit:contain}.head h1{font-size:22px;margin:0}.head p{margin:3px 0;color:#475569;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;font-size:13px}.table{overflow:auto}.table table{border-collapse:collapse;width:100%;font-size:11px}.table th,.table td{border:1px solid #cbd5e1;padding:6px;text-align:center}.table th:first-child,.table td:first-child{text-align:left}.summary{margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #cbd5e1;font-size:13px}.row.total{font-size:18px;font-weight:900;border-top:2px solid #111827}.balance{margin-top:10px;border:2px solid #111827;border-radius:12px;background:#fff3c4;padding:14px;text-align:center}.balance span{display:block;font-weight:900}.balance strong{display:block;font-size:30px;margin-top:6px}.bank{margin-top:12px;border:1px solid #dbe3ec;border-radius:12px;padding:12px}.bank strong{display:block;font-size:18px;overflow-wrap:anywhere}.note{font-size:12px;margin-top:12px}.error{max-width:520px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;color:#b91c1c}.thermal .table table{font-size:9px}.thermal .head h1{font-size:17px}.thermal .balance strong{font-size:24px}@media print{body{background:#fff}.bar{display:none}.sheet{width:auto;margin:0;box-shadow:none;padding:0}@page{size:A4 portrait;margin:10mm}body.thermal-mode .sheet{width:80mm;padding:0}body.thermal-mode{@page{size:80mm auto;margin:3mm}}}
</style>
</head>
<body>
<div class="bar"><button class="back" id="backBtn">← Kembali</button><button class="print" id="printBtn">🖨 Cetak / Simpan PDF</button></div>
<main id="root"></main>
<script>
(() => {
 const q=new URLSearchParams(location.search), id=q.get('id'), mode=q.get('mode')||'print';
 if(mode==='thermal')document.body.classList.add('thermal-mode');
 const root=document.getElementById('root');
 const esc=(v='')=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const money=v=>'Rp'+Number(v||0).toLocaleString('id-ID');
 const sizes=['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
 let db; try{db=JSON.parse(localStorage.getItem('shirogane-db')||'{}')}catch{db={}}
 const o=(db.orders||[]).find(x=>String(x.id)===String(id)); const s=db.settings||{};
 if(!o){root.innerHTML='<div class="error"><h2>Nota tidak ditemukan</h2><p>Kembali ke aplikasi lalu coba lagi.</p></div>';return}
 const qtyItem=it=>sizes.reduce((n,k)=>n+Math.max(0,Math.floor(Number((it.sizes||{})[k]||0))),0);
 let subtotal=0,extra=0,qty=0; const details={};
 for(const it of (o.items||[])){const iq=qtyItem(it),price=Number(it.price||0);qty+=iq;subtotal+=iq*price;const rates={...(s.sizeExtras||{}),...(it.extras||{})};for(const k of sizes){const n=Number((it.sizes||{})[k]||0),r=Number(rates[k]||0),a=n*r;if(a>0){extra+=a;if(!details[k])details[k]={qty:0,amount:0,rate:r};details[k].qty+=n;details[k].amount+=a}}}
 const discount=Number(o.discount||0),deposit=Number(o.deposit||0),total=Math.max(0,subtotal+extra-discount),balance=Math.max(0,total-deposit);
 root.innerHTML=`<article class="sheet ${mode==='thermal'?'thermal':''}"><header class="head">${s.logo?`<img class="logo" src="${s.logo}" alt="Logo">`:''}<div><h1>${esc(s.business||'SHIROGANE')}</h1><p>${esc(s.subtitle||'Production Suite')}</p><p>${esc(s.address||'')} ${s.phone?'• '+esc(s.phone):''}</p></div></header><section class="meta"><div><b>No.</b> ${esc(o.invoice||'-')}</div><div><b>Tanggal</b> ${esc(o.date||'-')}</div><div><b>Pelanggan</b> ${esc(o.customer||'-')}</div><div><b>Selesai</b> ${esc(o.dueDate||'-')}</div></section><div class="table"><table><thead><tr><th>Barang</th>${sizes.map(k=>`<th>${k}</th>`).join('')}<th>Qty</th><th>Harga</th><th>Jumlah</th></tr></thead><tbody>${(o.items||[]).map(it=>{const iq=qtyItem(it);return `<tr><td>${esc(it.name||'')}</td>${sizes.map(k=>`<td>${Number((it.sizes||{})[k]||0)||''}</td>`).join('')}<td>${iq}</td><td>${money(it.price)}</td><td>${money(iq*Number(it.price||0))}</td></tr>`}).join('')}</tbody></table></div><section class="summary"><div class="row"><span>Subtotal barang (${qty} pcs)</span><b>${money(subtotal)}</b></div>${Object.entries(details).map(([k,x])=>`<div class="row"><span>Ukuran ${k}: ${x.qty} pcs × ${money(x.rate)}</span><b>${money(x.amount)}</b></div>`).join('')}<div class="row"><span>Total tambahan ukuran</span><b>${money(extra)}</b></div><div class="row"><span>Diskon</span><b>-${money(discount)}</b></div><div class="row total"><span>Total Tagihan</span><b>${money(total)}</b></div><div class="row"><span>Panjar</span><b>${money(deposit)}</b></div><div class="balance"><span>Sisa Pembayaran</span><strong>${money(balance)}</strong></div></section>${(s.account||s.accountName)?`<section class="bank"><small>Transfer ke ${esc(s.bank||'Bank')}</small><strong>${esc(s.account||'-')}</strong><span>a.n. ${esc(s.accountName||'-')}</span></section>`:''}${o.notes?`<p class="note"><b>Catatan:</b> ${esc(o.notes)}</p>`:''}<p style="text-align:center;font-size:12px;margin-top:16px">Terima kasih telah mempercayakan pesanan kepada ${esc(s.business||'SHIROGANE')}.</p></article>`;
 document.getElementById('printBtn').addEventListener('click',()=>window.print());
 document.getElementById('backBtn').addEventListener('click',()=>history.length>1?history.back():location.replace('index.html?v=210'));
})();
</script>
</body>
</html>
